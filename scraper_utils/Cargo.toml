[package]
name = "scraper_utils"
version = "0.1.0"
edition = "2021"

[dependencies]
app_config = { path = "../app_config/" }
db = { path = "../db/" }
scraper = { path = "../scraper/" }
tracing = "0.1.41"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.31"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1", features = ["sync"] }
